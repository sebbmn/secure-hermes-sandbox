name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
        working-directory: sanitizer_proxy
      - run: npm run typecheck
        working-directory: sanitizer_proxy
      - run: npm run build
        working-directory: sanitizer_proxy